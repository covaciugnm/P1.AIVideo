[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Phase 8G — CPython 3.14 + pytest interaction: when ``urllib.request``
    # raises ``socket.gaierror`` from the asyncio DNS thread pool, CPython
    # records the in-thread exception as "unraisable" during GC. Our
    # OllamaProvider catches the resulting ``URLError`` and surfaces it
    # as ``unreachable:`` — code is correct. The warning is informational
    # only; ignore it so strict-warnings runs ``-W error`` don't
    # spuriously fail on environmental DNS errors.
    ignore::pytest.PytestUnraisableExceptionWarning
