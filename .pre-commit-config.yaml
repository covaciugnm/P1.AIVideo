# Pre-commit hooks for P1.AIVideo.
#
# Install: pip install pre-commit && pre-commit install
# Refresh hook versions periodically: pre-commit autoupdate
#
# Phase 0 keeps the hook set conservative. Stricter checks (mypy, eslint,
# yamllint with our own ruleset) land alongside the corresponding code.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^pipelines/.*\.yaml$   # pipeline files use ${VAR:-default} which check-yaml mis-parses
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
