# =============================================================================
# P1.AIVideo — production Compose file (documented placeholder)
#
# This file is intentionally a placeholder during Phase 0. A real production
# deployment differs from compose.dev.yml in ways that need careful per-host
# decisions; documenting them here so Phase 6+ has a clear target.
#
# Planned differences from compose.dev.yml:
#
#   - Replace bind-mounts with named volumes or external managed storage
#     (RDS-equivalent for Postgres, S3-compatible managed bucket for objects).
#   - Mount ./models as READ-ONLY (`:ro`). Downloads happen out-of-band on the
#     host.
#   - Pin image digests instead of tags (no `:latest`).
#   - Run all containers as non-root with `read_only: true` rootfs and a
#     tmpfs for /tmp. Drop all capabilities except those explicitly needed.
#   - Disable host port publishing for everything except Traefik. All other
#     services are reachable only through the reverse proxy.
#   - Add Traefik with TLS 1.3 + HSTS as the only public entrypoint.
#   - Enable Prometheus scraping + Grafana dashboards.
#   - Set logging driver to `json-file` with rotation, or ship to a central
#     log sink.
#   - Set restart policy to `on-failure` with a backoff, not `unless-stopped`.
#   - Remove the `model-llm` `profiles: ["llm"]` gate if the LLM is required
#     in production.
#
# Usage (once implemented):
#   docker compose -f docker/compose.prod.yml -f docker/compose.gpu.yml up -d
#
# See:
#   - docs/PROJECT_PLAN.md  (§15 Security & Privacy, §13 Hardware)
#   - docs/compliance/policy.md
# =============================================================================

