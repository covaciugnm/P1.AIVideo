# =============================================================================
# P1.AIVideo — development Compose file
#
# Phase 0 stub: services are wired up with image build contexts, env files,
# named volumes, and a private network. Application code lands in Phase 1+;
# until then most agent containers run a no-op stub command.
#
# Usage:
#   - CPU-only:   docker compose -f docker/compose.dev.yml up -d
#   - With GPUs:  docker compose -f docker/compose.dev.yml -f docker/compose.gpu.yml up -d
#
# Prerequisites for GPU services: NVIDIA driver + NVIDIA Container Toolkit on
# the host. See docs/runbooks/gpu-docker.md.
# =============================================================================

name: aivideo

# Common build args + env defaults reused across services.
x-build-defaults: &build-defaults
  context: ..
  args:
    PYTHON_VERSION: "3.11"

x-env-defaults: &env-defaults
  env_file:
    - ../.env
  restart: unless-stopped

networks:
  aivideo-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
  # Phase 4C: shared upload + artifact roots so the backend and the
  # (read-only) agents can speak about the same files. Backed by a
  # local-driver named volume — switch to bind mounts in prod.
  inputs_data:
  artifacts_data:

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    <<: *env-defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aivideo}
      POSTGRES_USER: ${POSTGRES_USER:-aivideo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [aivideo-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aivideo}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *env-defaults
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [aivideo-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    <<: *env-defaults
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aivideo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-please}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API (dev convenience)
      - "9001:9001"   # MinIO console
    networks: [aivideo-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Application services (Phase 1+ will replace stub CMDs)
  # ---------------------------------------------------------------------------

  backend:
    build:
      <<: *build-defaults
      dockerfile: docker/backend/Dockerfile
    image: aivideo-backend:latest
    <<: *env-defaults
    environment:
      # Connection strings point at the compose service names — not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aivideo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aivideo}
      REDIS_URL: redis://redis:6379/0
      # In-container storage roots. The named volumes (inputs_data,
      # artifacts_data) mount here. Setting these explicitly in the
      # compose file (not just relying on .env) makes the container
      # behavior independent of whatever the operator has in .env.
      UPLOADS_LOCAL_ROOT: /storage/inputs
      UPLOAD_AUDIO_ROOT: /storage/inputs/audio
      UPLOAD_IMAGE_ROOT: /storage/inputs/images
      UPLOAD_TEXT_ROOT: /storage/inputs/text
      ARTIFACTS_LOCAL_ROOT: /storage/artifacts
      # Hard-off: light runtime never auto-fetches model weights.
      ALLOW_MODEL_AUTODOWNLOAD: "false"
      # Phase 10B — SadTalker opt-in flags. Default OFF so the light
      # backend keeps returning ``provider_not_implemented`` per the
      # Phase 7B contract. Set both to ``true``/``1`` in the shell to
      # surface the categorised ``video_runtime_missing`` /
      # ``video_assets_missing`` / ``video_gpu_missing`` codes; the
      # API still refuses to write a fake MP4 — readiness probes report
      # the exact missing files via /api/v1/video/generate metadata.
      SADTALKER_ENABLE_REAL_INFERENCE: "${SADTALKER_ENABLE_REAL_INFERENCE:-false}"
      RUN_REAL_SADTALKER: "${RUN_REAL_SADTALKER:-0}"
      SADTALKER_MODELS_ROOT: "${SADTALKER_MODELS_ROOT:-/models/lipsync/sadtalker}"
      # Phase 10B — when set, the light backend proxies
      # /api/v1/video/generate (provider=sadtalker) over HTTP to the
      # ``model-sadtalker`` GPU wrapper. The light image stays torch-free;
      # all CUDA work happens inside the wrapper container. Unset → the
      # legacy in-process path (which returns runtime_missing in the
      # light image).
      SADTALKER_BASE_URL: "${SADTALKER_BASE_URL:-}"
      # Phase 10A-1 — when set, the backend proxies /api/v1/tts/generate
      # (provider=f5tts_ro) to the optional ``model-tts-ro`` Docker
      # service. Default empty → the backend reports the provider as
      # ``not_implemented`` so the UI shows clean readiness state.
      F5TTS_RO_BASE_URL: "${F5TTS_RO_BASE_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      # Phase 10B — mount the host ``models/`` tree read-only so the
      # SadTalker readiness probe can see operator-supplied weights at
      # ``/models/lipsync/sadtalker/...``. Empty by default — no
      # auto-download.
      - ../models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks: [aivideo-net]

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_VERSION: "20"
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: aivideo-frontend:latest
    <<: *env-defaults
    environment:
      # NEXT_PUBLIC_* is also baked at build time (see build.args above) —
      # exposing it at runtime documents intent and lets a future SSR path
      # read it from process.env without rebuilding.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks: [aivideo-net]

  orchestrator:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    image: aivideo-orchestrator:latest
    <<: *env-defaults
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aivideo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aivideo}
      REDIS_URL: redis://redis:6379/0
      UPLOADS_LOCAL_ROOT: /storage/inputs
      UPLOAD_AUDIO_ROOT: /storage/inputs/audio
      UPLOAD_IMAGE_ROOT: /storage/inputs/images
      UPLOAD_TEXT_ROOT: /storage/inputs/text
      ARTIFACTS_LOCAL_ROOT: /storage/artifacts
      ALLOW_MODEL_AUTODOWNLOAD: "false"
      # Phase 10A-1 — the orchestrator container is now a real DAG
      # worker. ``ORCHESTRATOR_MODE=idle`` falls back to the legacy
      # import-only smoke from light_idle.py. ``ORCHESTRATOR_DISABLE=true``
      # parks the container without running anything.
      ORCHESTRATOR_MODE: "${ORCHESTRATOR_MODE:-worker}"
      ORCHESTRATOR_POLL_INTERVAL_SECONDS: "${ORCHESTRATOR_POLL_INTERVAL_SECONDS:-5}"
      ORCHESTRATOR_BATCH_SIZE: "${ORCHESTRATOR_BATCH_SIZE:-8}"
      # Phase 11C — opt-in real SadTalker inference. The orchestrator
      # itself is torch-free; when SADTALKER_BASE_URL is set the
      # lipsync stage proxies to the GPU wrapper (model-sadtalker)
      # instead of attempting in-process torch. Both flags below must
      # be on for the wrapper-proxy path to activate.
      SADTALKER_ENABLE_REAL_INFERENCE: "${SADTALKER_ENABLE_REAL_INFERENCE:-false}"
      RUN_REAL_SADTALKER: "${RUN_REAL_SADTALKER:-0}"
      SADTALKER_BASE_URL: "${SADTALKER_BASE_URL:-}"
      SADTALKER_MODELS_ROOT: "${SADTALKER_MODELS_ROOT:-/models/lipsync/sadtalker}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      # Phase 10A-1: the worker now writes audio/video artifacts through
      # the DAG (when a stage produces a real file). The upload root
      # must be readable AND writable so e.g. the TTS path can land a
      # WAV under /storage/inputs/audio.
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      # Phase TTS-rescue — mount the models tree read-only so the
      # voice stage handler can load Piper .onnx voices from disk.
      # Backend already mounts ../models at /models; the orchestrator
      # needs the same view to honor PIPER_MODELS_ROOT=/models/tts/piper.
      - ../models:/models:ro
    networks: [aivideo-net]

  # --- Agents (CPU base) -----------------------------------------------------
  # GPU reservations live in compose.gpu.yml. Per-agent images can be split
  # later; for Phase 0 they share docker/agents/Dockerfile.

  agent-scriptwriter:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    depends_on: [redis]
    networks: [aivideo-net]

  agent-editor:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    depends_on: [redis, minio]
    networks: [aivideo-net]

  agent-qc:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    depends_on: [redis, minio]
    networks: [aivideo-net]

  agent-publisher:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    depends_on: [redis, minio]
    networks: [aivideo-net]

  agent-compliance:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    depends_on: [redis, postgres]
    networks: [aivideo-net]

  # --- GPU-capable agents (CUDA base; reservations added in compose.gpu.yml) -
  # Phase 4C: gated behind ``profiles: ["gpu"]`` so a plain ``compose up``
  # never pulls the CUDA base image or builds the GPU stub. Enable with
  # ``--profile gpu`` once the real GPU stack is wired (Phase 5/6).

  agent-voice:
    profiles: ["gpu"]
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile.cuda
    <<: *env-defaults
    depends_on: [redis, minio]
    volumes:
      - ../models:/models:ro
    networks: [aivideo-net]

  agent-face:
    profiles: ["gpu"]
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile.cuda
    <<: *env-defaults
    depends_on: [redis, minio]
    volumes:
      - ../models:/models:ro
    networks: [aivideo-net]

  agent-lipsync:
    profiles: ["gpu"]
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile.cuda
    <<: *env-defaults
    depends_on: [redis, minio]
    volumes:
      - ../models:/models:ro
    networks: [aivideo-net]

  # --- Optional: local LLM server (vLLM) -------------------------------------
  # Disabled by default in dev. Enable via the GPU overlay or by setting a
  # profile. Treat as optional; the Scriptwriter adapter can target this or
  # an external LLM at the operator's choice.
  model-llm:
    profiles: ["llm"]
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile.cuda
    <<: *env-defaults
    volumes:
      - ../models/llm:/models/llm:ro
    networks: [aivideo-net]

  # --- Optional: SadTalker GPU wrapper (Phase 10B) ---------------------------
  # GPU-only service. Build & start explicitly:
  #   make docker-sadtalker-build && make docker-sadtalker-up
  # Reachable from the backend at http://aivideo-model-sadtalker-1:8080 or
  # from the host at http://localhost:${SADTALKER_PORT:-8062}.
  # The wrapper refuses to fake MP4s: missing weights / runtime / GPU
  # surface a categorised error_code that the backend translates 1:1.
  model-sadtalker:
    profiles: ["sadtalker"]
    build:
      context: ..
      dockerfile: docker/model-sadtalker/Dockerfile
    image: aivideo-model-sadtalker:latest
    environment:
      SADTALKER_HOST: "0.0.0.0"
      SADTALKER_PORT: "8080"
      SADTALKER_MODELS_ROOT: "/models/lipsync/sadtalker"
      SADTALKER_SOURCE_DIR: "/opt/sadtalker"
      SADTALKER_RESULT_DIR: "/storage/artifacts/sadtalker"
      SADTALKER_INFER_TIMEOUT: "${SADTALKER_INFER_TIMEOUT:-900}"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${SADTALKER_PORT:-8062}:8080"
    volumes:
      - ../models/lipsync/sadtalker:/models/lipsync/sadtalker:ro
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
    networks: [aivideo-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8080/health\",timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --- Optional: F5TTS-Ro Romanian TTS wrapper (Phase 10A-1) ----------------
  # CPU-friendly default (slow). Build & start explicitly:
  #   make docker-tts-ro-build && make docker-tts-ro-up
  # Reachable from the backend at http://aivideo-model-tts-ro-1:8080 or
  # from the host at http://localhost:${TTS_RO_PORT:-8061}.
  # The service refuses to fake audio: if model assets / reference voice
  # aren't present under /models/f5tts-ro, /tts/generate returns a
  # categorised error (runtime_missing/assets_missing/...).
  model-tts-ro:
    profiles: ["tts-ro"]
    build:
      context: ..
      dockerfile: docker/model-tts-ro/Dockerfile
    image: aivideo-model-tts-ro:latest
    environment:
      F5TTS_RO_HOST: "0.0.0.0"
      F5TTS_RO_PORT: "8080"
      F5TTS_RO_MODELS_ROOT: "/models/f5tts-ro"
      F5TTS_RO_REFERENCE_AUDIO: "${F5TTS_RO_REFERENCE_AUDIO:-/models/f5tts-ro/reference/voice.wav}"
      F5TTS_RO_REFERENCE_TEXT: "${F5TTS_RO_REFERENCE_TEXT:-Aceasta este o voce de referinta.}"
      F5TTS_RO_DEVICE: "${F5TTS_RO_DEVICE:-cpu}"
      F5TTS_RO_ALLOW_AUTO_DOWNLOAD: "${F5TTS_RO_ALLOW_AUTO_DOWNLOAD:-false}"
    ports:
      - "${TTS_RO_PORT:-8061}:8080"
    volumes:
      - ../models/tts/f5tts-ro:/models/f5tts-ro:ro
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
    networks: [aivideo-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8080/health\",timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
