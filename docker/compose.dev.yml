  # --- Optional: SadTalker GPU wrapper (Phase 10B) ---------------------------
  # GPU-only service. Build & start explicitly:
  #   make docker-sadtalker-build && make docker-sadtalker-up
  # Reachable from the backend at http://aivideo-model-sadtalker-1:8080 or
  # from the host at http://localhost:${SADTALKER_PORT:-8062}.
  # The wrapper refuses to fake MP4s: missing weights / runtime / GPU
  # surface a categorised error_code that the backend translates 1:1.
  model-sadtalker:
    profiles: ["sadtalker"]
    build:
      context: ..
      dockerfile: docker/model-sadtalker/Dockerfile
    image: aivideo-model-sadtalker:latest
    environment:
      SADTALKER_HOST: "0.0.0.0"
      SADTALKER_PORT: "8080"
      SADTALKER_MODELS_ROOT: "/models/lipsync/sadtalker"
      SADTALKER_SOURCE_DIR: "/opt/sadtalker"
      SADTALKER_RESULT_DIR: "/storage/artifacts/sadtalker"
      SADTALKER_INFER_TIMEOUT: "${SADTALKER_INFER_TIMEOUT:-900}"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${SADTALKER_PORT:-8062}:8080"
    volumes:
      - ../models/lipsync/sadtalker:/models/lipsync/sadtalker:ro
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
    networks: [aivideo-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8080/health\",timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --- Optional: F5TTS-Ro Romanian TTS wrapper (Phase 10A-1) ----------------
  # CPU-friendly default (slow). Build & start explicitly:
  #   make docker-tts-ro-build && make docker-tts-ro-up
  # Reachable from the backend at http://aivideo-model-tts-ro-1:8080 or
  # from the host at http://localhost:${TTS_RO_PORT:-8061}.
  # The service refuses to fake audio: if model assets / reference voice
  # aren't present under /models/f5tts-ro, /tts/generate returns a
  # categorised error (runtime_missing/assets_missing/...).
  model-tts-ro:
    profiles: ["tts-ro"]
    build:
      context: ..
      dockerfile: docker/model-tts-ro/Dockerfile
    image: aivideo-model-tts-ro:latest
    environment:
      F5TTS_RO_HOST: "0.0.0.0"
      F5TTS_RO_PORT: "8080"
      # Phase 11F-CDOROB — models root + explicit checkpoint/vocab paths
      # for cdorob/f5-tts-romanian. Host layout:
      #   models/tts/f5tts-ro/model/model_last.pt
      #   models/tts/f5tts-ro/model/vocab.txt
      #   models/tts/f5tts-ro/reference/voice.wav
      #   models/tts/f5tts-ro/reference/reference.txt
      F5TTS_RO_MODELS_ROOT: "/models/tts/f5tts-ro"
      F5TTS_RO_CKPT_FILE: "${F5TTS_RO_CKPT_FILE:-/models/tts/f5tts-ro/model/model_last.pt}"
      F5TTS_RO_VOCAB_FILE: "${F5TTS_RO_VOCAB_FILE:-/models/tts/f5tts-ro/model/vocab.txt}"
      F5TTS_RO_MODEL_NAME: "${F5TTS_RO_MODEL_NAME:-F5TTS_v1_Base}"
      F5TTS_RO_REFERENCE_AUDIO: "${F5TTS_RO_REFERENCE_AUDIO:-/models/tts/f5tts-ro/reference/voice.wav}"
      F5TTS_RO_REFERENCE_TEXT_FILE: "${F5TTS_RO_REFERENCE_TEXT_FILE:-/models/tts/f5tts-ro/reference/reference.txt}"
      F5TTS_RO_DEVICE: "${F5TTS_RO_DEVICE:-cpu}"
      F5TTS_RO_ALLOW_AUTO_DOWNLOAD: "${F5TTS_RO_ALLOW_AUTO_DOWNLOAD:-false}"
    ports:
      - "${TTS_RO_PORT:-8061}:8080"
    volumes:
      - ../models:/models:ro
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
    networks: [aivideo-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8080/health\",timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =========================================================================
  # Phase 19 — Containerised Ollama runtime (optional alternative to the
  # host Ollama daemon used by default via host.docker.internal).
  #
  # When active, the backend can be pointed at this service by setting
  # ``OLLAMA_BASE_URL=http://aivideo-model-ollama-1:11434`` in .env, or
  # ``http://localhost:${MODEL_OLLAMA_PORT:-11435}`` from the host. The
  # container binds the project's ``models/qwen-gguf`` directory read-only
  # at ``/gguf`` so locally-downloaded GGUF files can be imported via
  # ``ollama create <tag> -f /gguf/Modelfile``.
  #
  # Profile-gated so the regular ``compose up`` flow leaves it offline
  # (which avoids port collisions with a user-level ``ollama serve`` on
  # the host).
  # =========================================================================
  model-ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: aivideo-model-ollama-1
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${MODEL_OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ../models/qwen-gguf:/gguf:ro
    networks: [aivideo-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =========================================================================
  # Phase 14 — Cloudflare named tunnel.
  #
  # Connects this stack to the public hostname configured in the
  # Cloudflare Zero Trust dashboard for tunnel id
  # ``ca9fd866-7d3d-46bb-9e0c-e83293f03bc2`` (route published as
  # AIV.alba-vision.ro). Routes (hostname → http://aivideo-frontend-1:3000
  # etc.) live on the dashboard side; this container only needs the
  # tunnel token to authenticate.
  #
  # ``--no-autoupdate`` pins the cloudflared binary to the image tag so
  # operator restarts are predictable; bump the image tag manually when
  # a new cloudflared release ships.
  # =========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aivideo-cloudflared-1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    networks: [aivideo-net]
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
