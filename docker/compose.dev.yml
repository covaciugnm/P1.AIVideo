# =============================================================================
# P1.AIVideo — development Compose file
#
# Phase 0 stub: services are wired up with image build contexts, env files,
# named volumes, and a private network. Application code lands in Phase 1+;
# until then most agent containers run a no-op stub command.
#
# Usage:
#   - CPU-only:   docker compose -f docker/compose.dev.yml up -d
#   - With GPUs:  docker compose -f docker/compose.dev.yml -f docker/compose.gpu.yml up -d
#
# Prerequisites for GPU services: NVIDIA driver + NVIDIA Container Toolkit on
# the host. See docs/runbooks/gpu-docker.md.
# =============================================================================

name: aivideo

# Common build args + env defaults reused across services.
x-build-defaults: &build-defaults
  context: ..
  args:
    PYTHON_VERSION: "3.11"

x-env-defaults: &env-defaults
  env_file:
    - ../.env
  restart: unless-stopped

# Connection strings for services that talk to postgres/redis from inside the
# compose network. The `.env` file ships host-side ports (5433/6380) so
# operators can reach the databases from the laptop; agents inside the
# network must use the service names + container-internal ports instead.
x-agent-runtime-env: &agent-runtime-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aivideo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aivideo}
  REDIS_URL: redis://redis:6379/0

networks:
  aivideo-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
  # Phase 4C: shared upload + artifact roots so the backend and the
  # (read-only) agents can speak about the same files. Backed by a
  # local-driver named volume — switch to bind mounts in prod.
  inputs_data:
  artifacts_data:
  # Phase 19: persists the `model-ollama` container's pulled models so
  # `ollama create` registrations survive container restarts.
  ollama_models:

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    <<: *env-defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aivideo}
      POSTGRES_USER: ${POSTGRES_USER:-aivideo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [aivideo-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aivideo}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *env-defaults
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [aivideo-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    <<: *env-defaults
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aivideo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-please}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API (dev convenience)
      - "9001:9001"   # MinIO console
    networks: [aivideo-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Application services (Phase 1+ will replace stub CMDs)
  # ---------------------------------------------------------------------------

  backend:
    build:
      <<: *build-defaults
      dockerfile: docker/backend/Dockerfile
    image: aivideo-backend:latest
    <<: *env-defaults
    environment:
      # Connection strings point at the compose service names — not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aivideo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aivideo}
      REDIS_URL: redis://redis:6379/0
      # In-container storage roots. The named volumes (inputs_data,
      # artifacts_data) mount here. Setting these explicitly in the
      # compose file (not just relying on .env) makes the container
      # behavior independent of whatever the operator has in .env.
      UPLOADS_LOCAL_ROOT: /storage/inputs
      UPLOAD_AUDIO_ROOT: /storage/inputs/audio
      UPLOAD_IMAGE_ROOT: /storage/inputs/images
      UPLOAD_TEXT_ROOT: /storage/inputs/text
      ARTIFACTS_LOCAL_ROOT: /storage/artifacts
      # Hard-off: light runtime never auto-fetches model weights.
      ALLOW_MODEL_AUTODOWNLOAD: "false"
      # Phase 10B — SadTalker opt-in flags. Default OFF so the light
      # backend keeps returning ``provider_not_implemented`` per the
      # Phase 7B contract. Set both to ``true``/``1`` in the shell to
      # surface the categorised ``video_runtime_missing`` /
      # ``video_assets_missing`` / ``video_gpu_missing`` codes; the
      # API still refuses to write a fake MP4 — readiness probes report
      # the exact missing files via /api/v1/video/generate metadata.
      SADTALKER_ENABLE_REAL_INFERENCE: "${SADTALKER_ENABLE_REAL_INFERENCE:-false}"
      RUN_REAL_SADTALKER: "${RUN_REAL_SADTALKER:-0}"
      SADTALKER_MODELS_ROOT: "${SADTALKER_MODELS_ROOT:-/models/lipsync/sadtalker}"
      # Phase 10B — when set, the light backend proxies
      # /api/v1/video/generate (provider=sadtalker) over HTTP to the
      # ``model-sadtalker`` GPU wrapper. The light image stays torch-free;
      # all CUDA work happens inside the wrapper container. Unset → the
      # legacy in-process path (which returns runtime_missing in the
      # light image).
      SADTALKER_BASE_URL: "${SADTALKER_BASE_URL:-}"
      # Phase 10A-1 — when set, the backend proxies /api/v1/tts/generate
      # (provider=f5tts_ro) to the optional ``model-tts-ro`` Docker
      # service. Default empty → the backend reports the provider as
      # ``not_implemented`` so the UI shows clean readiness state.
      F5TTS_RO_BASE_URL: "${F5TTS_RO_BASE_URL:-}"
      # Phase 20 — voice catalog root. The backend reads
      # ``${F5TTS_RO_MODELS_ROOT}/voices.yaml`` to expose one TTS
      # dropdown row per voice; absolute paths from the catalog are
      # forwarded to the wrapper, which sees the same /models mount.
      F5TTS_RO_MODELS_ROOT: "${F5TTS_RO_MODELS_ROOT:-/models/tts/f5tts-ro}"
      # Phase 11G — Ollama scriptwriter (external LLM daemon). The
      # backend reads these directly from the host env; the .env file
      # also exports them for the host shell, but compose pins them on
      # the backend service so a clean shell can still drive the
      # provider catalog. ``host.docker.internal`` works via the
      # extra_hosts mapping below; on Linux ``172.17.0.1`` (default
      # bridge) also reaches a host-side Ollama daemon.
      SCRIPTWRITER_BACKEND: "${SCRIPTWRITER_BACKEND:-template}"
      SCRIPTWRITER_ENABLE_NETWORK_CALLS: "${SCRIPTWRITER_ENABLE_NETWORK_CALLS:-false}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.6}"
      OLLAMA_FALLBACK_MODEL: "${OLLAMA_FALLBACK_MODEL:-qwen3:8b}"
      # Phase 20 — scriptwriter generation params (cinematic prompt).
      # All env-overridable; default to the recipe pinned by the operator
      # for Qwen-3.6 27B Q4 GGUF on a single GPU.
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0.7}"
      OLLAMA_TOP_P: "${OLLAMA_TOP_P:-0.9}"
      OLLAMA_TOP_K: "${OLLAMA_TOP_K:-20}"
      OLLAMA_REPEAT_PENALTY: "${OLLAMA_REPEAT_PENALTY:-1.05}"
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-8192}"
      OLLAMA_NUM_PREDICT: "${OLLAMA_NUM_PREDICT:-4096}"
      OLLAMA_STOP: "${OLLAMA_STOP:-<|im_end|>;;<|endoftext|>}"
      OLLAMA_GENERATE_TIMEOUT_SECONDS: "${OLLAMA_GENERATE_TIMEOUT_SECONDS:-300}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # Phase 11G — let the backend container reach a host-side Ollama
      # daemon via ``host.docker.internal`` even on Linux (where Docker
      # does not auto-map it). Operators with Ollama in a sibling
      # container can override OLLAMA_BASE_URL to that container's
      # service name instead.
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      # Phase 10B — mount the host ``models/`` tree read-only so the
      # SadTalker readiness probe can see operator-supplied weights at
      # ``/models/lipsync/sadtalker/...``. Empty by default — no
      # auto-download.
      - ../models:/models:ro
      # Phase IG-1 — ComfyUI identity-consistent workflow templates. The
      # backend reads + substitutes these before POSTing to ComfyUI. See
      # workflows/comfyui/README.md.
      - ../workflows:/workflows:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks: [aivideo-net]

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_VERSION: "20"
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: aivideo-frontend:latest
    <<: *env-defaults
    environment:
      # NEXT_PUBLIC_* is also baked at build time (see build.args above) —
      # exposing it at runtime documents intent and lets a future SSR path
      # read it from process.env without rebuilding.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # Phase 14B/15X — runtime override so Next.js listens on the port
      # the operator has configured Cloudflare to talk to. Defaults to
      # 8010 (matches the current Public Hostname service URL).
      PORT: "8010"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3010}:8010"
    networks: [aivideo-net]
    # Override the Dockerfile healthcheck to match the runtime PORT.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8010/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  orchestrator:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    image: aivideo-orchestrator:latest
    <<: *env-defaults
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aivideo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aivideo}
      REDIS_URL: redis://redis:6379/0
      UPLOADS_LOCAL_ROOT: /storage/inputs
      UPLOAD_AUDIO_ROOT: /storage/inputs/audio
      UPLOAD_IMAGE_ROOT: /storage/inputs/images
      UPLOAD_TEXT_ROOT: /storage/inputs/text
      ARTIFACTS_LOCAL_ROOT: /storage/artifacts
      ALLOW_MODEL_AUTODOWNLOAD: "false"
      # Phase 10A-1 — the orchestrator container is now a real DAG
      # worker. ``ORCHESTRATOR_MODE=idle`` falls back to the legacy
      # import-only smoke from light_idle.py. ``ORCHESTRATOR_DISABLE=true``
      # parks the container without running anything.
      ORCHESTRATOR_MODE: "${ORCHESTRATOR_MODE:-worker}"
      ORCHESTRATOR_POLL_INTERVAL_SECONDS: "${ORCHESTRATOR_POLL_INTERVAL_SECONDS:-5}"
      ORCHESTRATOR_BATCH_SIZE: "${ORCHESTRATOR_BATCH_SIZE:-8}"
      # Phase 11C — opt-in real SadTalker inference. The orchestrator
      # itself is torch-free; when SADTALKER_BASE_URL is set the
      # lipsync stage proxies to the GPU wrapper (model-sadtalker)
      # instead of attempting in-process torch. Both flags below must
      # be on for the wrapper-proxy path to activate.
      SADTALKER_ENABLE_REAL_INFERENCE: "${SADTALKER_ENABLE_REAL_INFERENCE:-false}"
      RUN_REAL_SADTALKER: "${RUN_REAL_SADTALKER:-0}"
      SADTALKER_BASE_URL: "${SADTALKER_BASE_URL:-}"
      SADTALKER_MODELS_ROOT: "${SADTALKER_MODELS_ROOT:-/models/lipsync/sadtalker}"
      # Phase 11F-CDOROB — when set, the voice stage proxies
      # provider=f5tts_ro to the model-tts-ro wrapper. Unset → DAG
      # rejects the request with tts_provider_not_configured.
      F5TTS_RO_BASE_URL: "${F5TTS_RO_BASE_URL:-}"
      # Phase 21 — FLUX wrapper URL forwarded so scene_composer can
      # render per-scene B-roll images on the orchestrator side too.
      FLUX_LOCAL_BASE_URL: "${FLUX_LOCAL_BASE_URL:-}"
      # Phase 20 — voice catalog root (mirrors backend).
      F5TTS_RO_MODELS_ROOT: "${F5TTS_RO_MODELS_ROOT:-/models/tts/f5tts-ro}"
      # Phase 11G — Ollama scriptwriter env mirrored on the orchestrator
      # so the scriptwriter stage in the DAG can reach the same daemon
      # the backend uses for /api/v1/script/generate previews.
      SCRIPTWRITER_BACKEND: "${SCRIPTWRITER_BACKEND:-template}"
      SCRIPTWRITER_ENABLE_NETWORK_CALLS: "${SCRIPTWRITER_ENABLE_NETWORK_CALLS:-false}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.6}"
      OLLAMA_FALLBACK_MODEL: "${OLLAMA_FALLBACK_MODEL:-qwen3:8b}"
      # Phase 20 — mirror scriptwriter tuning params on the orchestrator.
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0.7}"
      OLLAMA_TOP_P: "${OLLAMA_TOP_P:-0.9}"
      OLLAMA_TOP_K: "${OLLAMA_TOP_K:-20}"
      OLLAMA_REPEAT_PENALTY: "${OLLAMA_REPEAT_PENALTY:-1.05}"
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-8192}"
      OLLAMA_NUM_PREDICT: "${OLLAMA_NUM_PREDICT:-4096}"
      OLLAMA_STOP: "${OLLAMA_STOP:-<|im_end|>;;<|endoftext|>}"
      OLLAMA_GENERATE_TIMEOUT_SECONDS: "${OLLAMA_GENERATE_TIMEOUT_SECONDS:-300}"
    extra_hosts:
      # Phase 11G — same Linux host-gateway shim as the backend so the
      # orchestrator's scriptwriter stage can reach a host-side Ollama
      # daemon via http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      # Phase 10A-1: the worker now writes audio/video artifacts through
      # the DAG (when a stage produces a real file). The upload root
      # must be readable AND writable so e.g. the TTS path can land a
      # WAV under /storage/inputs/audio.
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      # Phase TTS-rescue — mount the models tree read-only so the
      # voice stage handler can load Piper .onnx voices from disk.
      # Backend already mounts ../models at /models; the orchestrator
      # needs the same view to honor PIPER_MODELS_ROOT=/models/tts/piper.
      - ../models:/models:ro
    networks: [aivideo-net]

  # --- Agents (CPU base) -----------------------------------------------------
  # GPU reservations live in compose.gpu.yml. Per-agent images can be split
  # later; for Phase 0 they share docker/agents/Dockerfile.

  # Common storage mount block — every agent worker that picks up
  # voice / face / lipsync / qc / publisher stages needs to see the
  # SAME ``/storage/inputs`` + ``/storage/artifacts`` that the backend
  # wrote to (otherwise the path validators reject "file not found").
  # Phase 12W bugfix: the original Phase 0 agent services were
  # storage-less and the orchestrator was the only worker with the
  # mounts. As soon as the DAG load-balances voice across agents,
  # they hit ``audio file not found``.
  agent-scriptwriter:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    environment:
      <<: *agent-runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      - ../models:/models:ro
    networks: [aivideo-net]

  agent-editor:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    environment:
      <<: *agent-runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      - ../models:/models:ro
    networks: [aivideo-net]

  agent-qc:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    environment:
      <<: *agent-runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      - ../models:/models:ro
    networks: [aivideo-net]

  agent-publisher:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    environment:
      <<: *agent-runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      - ../models:/models:ro
    networks: [aivideo-net]

  agent-compliance:
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile
    <<: *env-defaults
    environment:
      <<: *agent-runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      - ../models:/models:ro
    networks: [aivideo-net]

  # --- GPU-capable agents (CUDA base; reservations added in compose.gpu.yml) -
  # Phase 4C: gated behind ``profiles: ["gpu"]`` so a plain ``compose up``
  # never pulls the CUDA base image or builds the GPU stub. Enable with
  # ``--profile gpu`` once the real GPU stack is wired (Phase 5/6).

  agent-voice:
    profiles: ["gpu"]
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile.cuda
    <<: *env-defaults
    environment:
      <<: *agent-runtime-env
    depends_on: [redis, minio]
    volumes:
      # Phase 21-fix — these GPU agents also run the DAG worker and can
      # pick up ANY stage (voice/face/lipsync). Without the shared
      # storage volumes the F5/SadTalker wrappers write to the real
      # volume but the agent checks its own ephemeral /storage and reports
      # "missing on the shared volume". Mirror the CPU agents exactly.
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      - ../models:/models:ro
    networks: [aivideo-net]

  agent-face:
    profiles: ["gpu"]
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile.cuda
    <<: *env-defaults
    environment:
      <<: *agent-runtime-env
    depends_on: [redis, minio]
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      - ../models:/models:ro
    networks: [aivideo-net]

  agent-lipsync:
    profiles: ["gpu"]
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile.cuda
    <<: *env-defaults
    environment:
      <<: *agent-runtime-env
    depends_on: [redis, minio]
    volumes:
      - inputs_data:/storage/inputs
      - artifacts_data:/storage/artifacts
      - ../models:/models:ro
    networks: [aivideo-net]

  # --- Optional: local LLM server (vLLM) -------------------------------------
  # Disabled by default in dev. Enable via the GPU overlay or by setting a
  # profile. Treat as optional; the Scriptwriter adapter can target this or
  # an external LLM at the operator's choice.
  model-llm:
    profiles: ["llm"]
    build:
      <<: *build-defaults
      dockerfile: docker/agents/Dockerfile.cuda
    <<: *env-defaults
    volumes:
      - ../models/llm:/models/llm:ro
    networks: [aivideo-net]

  # --- Optional: SDXL GPU wrapper (Phase 12W) --------------------------------
  # GPU-only image generation service. Build & start explicitly:
  #   make docker-sdxl-build && make docker-sdxl-up
  # Reachable from the backend at http://aivideo-model-sdxl-1:8080 or
  # from the host at http://localhost:${SDXL_PORT:-8063}.
  model-sdxl:
    profiles: ["sdxl"]
    build:
      context: ..
      dockerfile: docker/model-sdxl/Dockerfile
    image: aivideo-model-sdxl:latest
    environment:
      SDXL_MODELS_ROOT: "/models/image/sdxl"
      SDXL_DEFAULT_MODEL: "${SDXL_DEFAULT_MODEL:-sdxl-base-1.0}"
      SDXL_RESULT_DIR: "/storage/artifacts/sdxl"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${SDXL_PORT:-8063}:8080"
    volumes:
      - ../models/image/sdxl:/models/image/sdxl:ro
      - artifacts_data:/storage/artifacts
    networks: [aivideo-net]
    restart: unless-stopped

  # --- Optional: FLUX.1 GPU wrapper (Phase 12W) ------------------------------
  # Build: make docker-flux-build  Run: make docker-flux-up
  # Operator must accept the BFL license on Hugging Face for FLUX.1-schnell
  # / FLUX.1-dev before download.
  model-flux:
    profiles: ["flux"]
    build:
      context: ..
      dockerfile: docker/model-flux/Dockerfile
    image: aivideo-model-flux:latest
    environment:
      FLUX_MODELS_ROOT: "/models/image/flux"
      FLUX_DEFAULT_MODEL: "${FLUX_DEFAULT_MODEL:-flux.1-schnell}"
      FLUX_RESULT_DIR: "/storage/artifacts/flux"
      FLUX_ENABLE_CPU_OFFLOAD: "${FLUX_ENABLE_CPU_OFFLOAD:-true}"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${FLUX_PORT:-8064}:8080"
    volumes:
      - ../models/image/flux:/models/image/flux:ro
      - artifacts_data:/storage/artifacts
    networks: [aivideo-net]
    restart: unless-stopped

  # --- Optional: SD3.5 GPU wrapper (Phase 12W) -------------------------------
  # SD3.5 Large is GATED on HF — operator accepts the Stability AI license
  # and uses HF_TOKEN to download.
  model-sd35:
    profiles: ["sd35"]
    build:
      context: ..
      dockerfile: docker/model-sd35/Dockerfile
    image: aivideo-model-sd35:latest
    environment:
      SD35_MODELS_ROOT: "/models/image/sd35"
      SD35_DEFAULT_MODEL: "${SD35_DEFAULT_MODEL:-stable-diffusion-3.5-large}"
      SD35_RESULT_DIR: "/storage/artifacts/sd35"
      SD35_ENABLE_CPU_OFFLOAD: "${SD35_ENABLE_CPU_OFFLOAD:-true}"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${SD35_PORT:-8065}:8080"
    volumes:
      - ../models/image/sd35:/models/image/sd35:ro
      - artifacts_data:/storage/artifacts
    networks: [aivideo-net]
    restart: unless-stopped

  # --- Optional: AUTOMATIC1111 WebUI GPU wrapper (Phase 12W) -----------------
  # Python 3.10 + pre-populated repositories/ to work around the
  # archived Stability-AI/stablediffusion upstream + cu128 torch for
  # RTX 5090 Blackwell. See docker/model-a1111/Dockerfile rationale.
  model-a1111:
    profiles: ["a1111"]
    build:
      context: ..
      dockerfile: docker/model-a1111/Dockerfile
    image: aivideo-model-a1111:latest
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${A1111_PORT:-7860}:7860"
    volumes:
      # Mount SDXL weights from the shared models tree — operator drops
      # the .safetensors once and every wrapper sees it.
      - ../models/image/sdxl/sdxl-base-1.0/sd_xl_base_1.0.safetensors:/a1111/models/Stable-diffusion/sd_xl_base_1.0.safetensors:ro
      - artifacts_data:/a1111/outputs
    networks: [aivideo-net]
    restart: unless-stopped

  # --- Optional: ComfyUI GPU wrapper (Phase 12W) -----------------------------
  # Mirror of model-sdxl/model-flux/model-sd35: keeps ComfyUI off the host
  # so it's stop-able like every other GPU service. Models + custom_nodes
  # mount read-only/rw from the host so operators can share weights.
  model-comfyui:
    profiles: ["comfyui"]
    build:
      context: ..
      dockerfile: docker/model-comfyui/Dockerfile
    image: aivideo-model-comfyui:latest
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${COMFYUI_PORT:-8066}:8188"
    volumes:
      # Share image-generator models with the other wrappers — operator
      # can drop sd_xl_base_1.0.safetensors etc. once and every backend
      # sees it.
      - ../models/image/sdxl/sdxl-base-1.0:/comfyui/models/checkpoints/sdxl-base-1.0:ro
      - ../models/image/flux:/comfyui/models/flux:ro
      - ../models/image/sd35:/comfyui/models/sd35:ro
      # Phase IG-B (SDXL-InstantID identity pipeline): operator-supplied
      # custom nodes + InstantID/ControlNet/insightface weights. No
      # auto-download; see workflows/comfyui/README.md + Raport claude.
      - ./model-comfyui/custom_nodes:/comfyui/custom_nodes
      - ../models/image/instantid:/comfyui/models/instantid:ro
      - ../models/image/controlnet:/comfyui/models/controlnet:ro
      - ../models/image/insightface:/comfyui/models/insightface:ro
      # ComfyUI scratchpad for outputs + custom workflows the operator
      # might place.
      - artifacts_data:/comfyui/output
    networks: [aivideo-net]
    restart: unless-stopped

