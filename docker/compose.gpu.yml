# =============================================================================
# P1.AIVideo — GPU overlay
#
# Adds NVIDIA GPU reservations to the agents that need them. Use alongside
# compose.dev.yml or compose.prod.yml. Requires the NVIDIA Container Toolkit
# on the host — see docs/runbooks/gpu-docker.md.
#
# Usage:
#   docker compose -f docker/compose.dev.yml -f docker/compose.gpu.yml up -d
# =============================================================================

name: aivideo

x-gpu-reservation: &gpu-one
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  environment:
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
    NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}

services:
  agent-voice:
    <<: *gpu-one

  agent-face:
    <<: *gpu-one

  agent-lipsync:
    <<: *gpu-one
    # Phase 7C SadTalker readiness configuration. All flags are off by
    # default — real inference (Phase 7D) requires the operator to flip
    # SADTALKER_ENABLE_REAL_INFERENCE=true AND RUN_REAL_SADTALKER=1
    # AND place weights under ${SADTALKER_MODELS_ROOT}.
    environment:
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-sadtalker}
      SADTALKER_MODELS_ROOT: /models/lipsync/sadtalker
      SADTALKER_ENABLE_REAL_INFERENCE: "${SADTALKER_ENABLE_REAL_INFERENCE:-false}"
      RUN_REAL_SADTALKER: "${RUN_REAL_SADTALKER:-0}"
      ALLOW_MODEL_AUTODOWNLOAD: "false"
    # Weights are mounted read-only from the host — no chance the
    # container can mutate or replace them. The path on the host is the
    # operator's choice; ../models is the default for `make up-gpu`.
    volumes:
      - ../models/lipsync/sadtalker:/models/lipsync/sadtalker:ro

  # Local LLM server — enable with `--profile llm`.
  model-llm:
    profiles: ["llm"]
    <<: *gpu-one

  # Optional: QC may want a GPU for sync-confidence / vision checks.
  # Uncomment if your host has spare VRAM.
  # agent-qc:
  #   <<: *gpu-one
