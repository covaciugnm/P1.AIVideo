# P1.AIVideo agents — installable as the ``agents`` top-level package.
#
# Layout: pyproject.toml lives INSIDE the agents/ directory. We map the
# directory itself to the ``agents`` Python package via ``package-dir`` and
# enumerate every subpackage explicitly. After ``pip install -e ./agents``,
# ``import agents.X.Y`` resolves without any ``sys.path`` manipulation.
#
# An auto-``find`` approach with ``where = [".."]`` would also work in
# theory, but reaching above the project directory is fragile (some
# setuptools versions reject it). The explicit list below is the trade-off:
# slightly verbose, but every subpackage is checked-in code so the list
# only grows when a new agent dir lands.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivideo-agents"
version = "0.4.0"
description = "P1.AIVideo specialist agents — installable as `agents.*` (Phase 3G: scriptwriter contract)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "aivideo-common>=0.2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "fakeredis>=2.23",
  "ruff>=0.7",
]
# Phase 3B (narrow) voice extra. Enables the real Piper TTS path in
# `agents/voice/providers/piper/provider.py` via lazy import. Install with:
#   pip install -e ./agents[voice]
# Operators must still place voice .onnx + .onnx.json files manually under
# $PIPER_MODELS_ROOT — no auto-download.
voice = [
  "soundfile",
  "piper-tts",
]
# TODO(future phases): face / lipsync-sadtalker extras. Those introduce
# torch / safetensors / opencv / gfpgan and are deliberately NOT listed
# here while the project stays in the narrow Piper-only integration scope.

[tool.setuptools]
packages = [
    "agents",
    "agents.compliance_officer",
    "agents.orchestrator",
    "agents.scriptwriter",
    "agents.scriptwriter.core",
    "agents.scriptwriter.providers",
    "agents.scriptwriter.providers.template",
    "agents.scriptwriter.providers.ollama",
    "agents.scriptwriter.providers.vllm",
    "agents.scriptwriter.providers.openai_compatible",
    "agents.scriptwriter.providers.openai",
    "agents.scriptwriter.providers.anthropic",
    "agents.scriptwriter.providers.local_http",
    "agents.voice",
    "agents.voice.core",
    "agents.voice.providers",
    "agents.voice.providers.piper",
    "agents.face",
    "agents.editor",
    "agents.qc",
    "agents.publisher",
    "agents.lipsync",
    "agents.lipsync.core",
    "agents.lipsync.providers",
    "agents.lipsync.providers.sadtalker",
    "agents.lipsync.providers.musetalk",
    "agents.lipsync.providers.wav2lip",
]

# Tell setuptools: the `agents` Python package's source root is `.` (this
# directory). Subpackages then resolve naturally as agents/<name>/.
[tool.setuptools.package-dir]
"agents" = "."

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
