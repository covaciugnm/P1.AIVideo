# P1.AIVideo agents — Phase 1 scope.
#
# This is the shared root for agent code. Phase 1 only ships the compliance
# officer's policy_gate and the orchestrator skeleton — no GPU deps.
#
# Per-agent GPU extras (torch / diffusers / SadTalker etc.) land in Phase 3.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivideo-agents"
version = "0.1.0"
description = "P1.AIVideo specialist agents. Phase 1: compliance + orchestrator skeletons only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "aivideo-common>=0.2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "fakeredis>=2.23",
  "ruff>=0.7",
]
# Phase 3B (narrow) voice extra. Enables the real Piper TTS path in
# `agents/voice/providers/piper/provider.py` via lazy import. Install with:
#   pip install -e ./agents[voice]
# Operators must still place voice .onnx + .onnx.json files manually under
# $PIPER_MODELS_ROOT — no auto-download.
voice = [
  "soundfile",
  "piper-tts",
]
# TODO(future phases): face / lipsync-sadtalker extras. Those introduce
# torch / safetensors / opencv / gfpgan and are deliberately NOT listed
# here while the project stays in the narrow Piper-only integration scope.

[tool.setuptools]
packages = ["compliance_officer", "orchestrator"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
