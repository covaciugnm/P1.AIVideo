# Fast reel pipeline. Trades quality for wall time.
# Compliance gates are non-negotiable across all pipelines — only quality knobs change.

name: reel_fast
schema_version: 1

defaults:
  duration:
    target_seconds: ${TARGET_DURATION_SECONDS:-30}
    min_seconds: ${MIN_REEL_DURATION_SECONDS:-15}
    max_seconds: ${MAX_REEL_DURATION_SECONDS:-60}
  compliance:
    watermark_required: true
    c2pa_required: true
    compliance_token_required: true

budget:
  max_wall_minutes: 6
  max_gpu_minutes: 4

stages:
  - id: policy_gate
    agent: compliance_officer
    role: intake_gate
    params:
      target_duration_seconds: ${TARGET_DURATION_SECONDS:-30}
      min_duration_seconds: ${MIN_REEL_DURATION_SECONDS:-15}
      max_duration_seconds: ${MAX_REEL_DURATION_SECONDS:-60}

  - id: scriptwriter
    agent: scriptwriter
    needs: [policy_gate]

  - id: voice
    agent: voice
    needs: [scriptwriter]

  - id: face
    agent: face
    needs: [policy_gate]
    params:
      resolution: 768          # smaller portrait

  - id: identity_guard
    agent: compliance_officer
    role: identity_guard
    needs: [face]

  - id: pre_lipsync_auth
    agent: compliance_officer
    role: pre_lipsync_auth
    needs: [identity_guard, voice]
    params:
      issue_token: true
      token_ttl_seconds: 3600

  - id: lipsync
    agent: lipsync
    needs: [pre_lipsync_auth]
    params:
      backend: "${LIPSYNC_BACKEND}"   # still SadTalker; smaller resolution
      fps: 25
      resolution: 256
      restoration: false              # skip GFPGAN pass
      compliance_token_required: true

  - id: editor
    agent: editor
    needs: [lipsync, scriptwriter]
    params:
      watermark_required: true

  - id: qc
    agent: qc
    needs: [editor]

  - id: export_disclosure_validation
    agent: compliance_officer
    role: export_disclosure_validation
    needs: [qc]
    params:
      watermark_required: true
      c2pa_required: true

  - id: publisher
    agent: publisher
    needs: [export_disclosure_validation]
