# P1.AIVideo backend (FastAPI) — Phase 1 scope: metadata-only flow.
# No torch / diffusers / CUDA libraries. No model inference.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivideo-backend"
version = "0.1.0"
description = "P1.AIVideo backend service (FastAPI). Phase 1: metadata-only flow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "P1.AIVideo" }]
dependencies = [
  "aivideo-common>=0.2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  # Phase 6B: schema migrations. Alembic ships with no native deps and
  # runs against the existing async drivers via run_sync(); no
  # ``psycopg2``/``psycopg3`` is pulled in.
  "alembic>=1.13",
  "redis>=5.0",
  "pyyaml>=6.0",
  "structlog>=24.1",
  # python-multipart is FastAPI's required parser for multipart/form-data;
  # added in Phase 4A-2 for the audio + image upload endpoints. Pure-Python,
  # no native deps.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "fakeredis>=2.23",
  "ruff>=0.7",
]
# Phase 8G — opt-in TTS extra. Install with ``pip install -e ./backend[tts]``
# or via the Docker build arg ``INSTALL_PIPER=true``. piper-tts pulls in
# onnxruntime (~50 MB wheel); kept out of the default light backend so
# operators who don't want Piper don't pay the bytes.
tts = [
  "piper-tts>=1.2",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() pattern

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
