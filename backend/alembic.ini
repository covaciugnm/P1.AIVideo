# Phase 6B Alembic configuration.
#
# DATABASE_URL is resolved at run time via env.py from
# app.core.config.settings.get_database_url(), which means:
#  - tests can override via DATABASE_URL=sqlite+aiosqlite:///:memory:
#  - docker light runs against postgresql+asyncpg://… inside the container
#  - host-side dev defaults to the same DATABASE_URL the FastAPI app uses
#
# The ``sqlalchemy.url`` key below is intentionally blank; env.py rewrites
# it on every invocation.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
